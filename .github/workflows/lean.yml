name: Lean

on:
  push:
    branches:
      - agent/stoch-to-det-lower-bound-190

concurrency:
  group: lower-bound-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          lake update
          lake exe cache get
      - name: Build proof
        run: lake build
